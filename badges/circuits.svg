<svg xmlns="http://www.w3.org/2000/svg" width="495" height="180" viewBox="0 0 495 180" role="img" aria-labelledby="t d">
  <title id="t">Circuits activity, this month</title>
  <desc id="d">Activity graph styled as an illuminated printed circuit board trace.</desc>
  <defs>
    <clipPath id="clip">
      <rect width="495" height="180" rx="12"/>
    </clipPath>
    <linearGradient id="board" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1712"/>
      <stop offset="0.55" stop-color="#0d1d16"/>
      <stop offset="1" stop-color="#07110d"/>
    </linearGradient>
    <linearGradient id="signal-fill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#72f0b6" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#72f0b6" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="12" height="12" patternUnits="userSpaceOnUse">
      <path d="M12 0H0V12" fill="none" stroke="#a2ffd1" stroke-opacity="0.025" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <g clip-path="url(#clip)">
    <rect width="495" height="180" fill="url(#board)"/>
    <rect width="495" height="180" fill="url(#grid)"/>

    <!-- Quiet copper routes embedded in the board. -->
    <g fill="none" stroke="#285541" stroke-width="1.35" opacity="0.72">
      <path d="M0 24H72L83 35H137"/>
      <path d="M0 152H66L78 140H118"/>
      <path d="M185 0V22L194 31H240"/>
      <path d="M286 0V18L298 30H355"/>
      <path d="M495 47H452L440 35H406"/>
      <path d="M495 145H468L456 157H394"/>
      <path d="M260 180V164L249 153H222"/>
      <path d="M338 180V166L327 155"/>
    </g>
    <g fill="#09130f" stroke="#3a7659" stroke-width="1.2">
      <circle cx="83" cy="35" r="3.2"/>
      <circle cx="78" cy="140" r="3.2"/>
      <circle cx="194" cy="31" r="3.2"/>
      <circle cx="298" cy="30" r="3.2"/>
      <circle cx="440" cy="35" r="3.2"/>
      <circle cx="456" cy="157" r="3.2"/>
      <circle cx="249" cy="153" r="3.2"/>
      <circle cx="327" cy="155" r="3.2"/>
    </g>

    <!-- Board silkscreen. -->
    <g fill="#7eb69c" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
      <text x="20" y="18" font-size="7" letter-spacing="1.4">ACTIVITY_CTRL</text>
      <text x="474" y="18" font-size="7" letter-spacing="1.2" text-anchor="end">REV.03</text>
      <text x="474" y="34" fill="#b0d8c4" font-size="11" text-anchor="end">this month</text>
      <text x="150" y="163" font-size="6.5" letter-spacing="1.1">SIGNAL / CONTRIBUTIONS</text>
      <text x="460" y="163" font-size="6.5" text-anchor="end">OUT</text>
    </g>

    <!-- Controller package and pins. -->
    <path d="M31 54H104L113 63V120L104 129H31L22 120V63Z" fill="#101f18" stroke="#4a8f6d" stroke-width="1.4"/>
    <path d="M39 65H96L102 71V112L96 118H39L33 112V71Z" fill="#0a1510" stroke="#285541"/>
    <circle cx="42" cy="74" r="2.4" fill="none" stroke="#73d8a7" stroke-width="1.2"/>
    <g fill="#92e4bd">
      <path d="M14 66H22V70H14Z"/><path d="M113 66H121V70H113Z"/>
      <path d="M14 80H22V84H14Z"/><path d="M113 80H121V84H113Z"/>
      <path d="M14 94H22V98H14Z"/><path d="M113 94H121V98H113Z"/>
      <path d="M14 108H22V112H14Z"/><path d="M113 108H121V112H113Z"/>
    </g>
    <g fill="#8fc9ad" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle">
      <text x="68" y="88" font-size="7" letter-spacing="1.2">GH-24</text>
      <text x="68" y="103" fill="#d3f6e4" font-size="13" font-weight="700">IC</text>
      <text x="68" y="113" font-size="5.5" letter-spacing="0.8">ACTIVITY</text>
    </g>
    <g fill="none" stroke="#3b7b5c" stroke-width="1.4">
      <path d="M121 68H133V42H160"/>
      <path d="M121 82H139V58H181"/>
      <path id="signal-input" d="M121 96H132V137H150"/>
      <path d="M121 110H141V149H183"/>
    </g>

    <!-- Orthogonal graph area. -->
    <path id="circuit-area" d="M150 137H169V125H189V132H208V111H228V119H247V96H267V114H286V101H306V84H325V116H344V82H364V118H383V76H403V104H422V91H458V150H150Z" fill="url(#signal-fill)"/>
    <path d="M150 150H458" fill="none" stroke="#8ddbb5" stroke-opacity="0.18" stroke-width="1"/>
    <g stroke="#8ddbb5" stroke-opacity="0.1" stroke-width="1" stroke-dasharray="2 5">
      <path d="M247 48V150"/>
      <path d="M344 48V150"/>
      <path d="M422 48V150"/>
    </g>

    <!-- Activity signal: dark solder mask edge plus luminous copper core. -->
    <path id="circuit-shadow" d="M150 137H169V125H189V132H208V111H228V119H247V96H267V114H286V101H306V84H325V116H344V82H364V118H383V76H403V104H422V91H458"
          fill="none" stroke="#07110d" stroke-width="6" stroke-linejoin="round"/>
    <path id="circuit-line" d="M150 137H169V125H189V132H208V111H228V119H247V96H267V114H286V101H306V84H325V116H344V82H364V118H383V76H403V104H422V91H458"
          fill="none" stroke="#72efb5" stroke-width="2.2" stroke-linecap="square" stroke-linejoin="round" filter="url(#glow)"/>

    <!-- Vias mark graph samples and make the trace read as a PCB route. -->
    <!-- signal-vias:start -->
    <g fill="#0b1712" stroke="#8bffc9" stroke-width="1.4">
      <circle cx="150" cy="137" r="3.4"/>
      <circle cx="208" cy="111" r="3.4"/>
      <circle cx="247" cy="96" r="3.4"/>
      <circle cx="306" cy="84" r="3.4"/>
      <circle cx="344" cy="82" r="3.4"/>
      <circle cx="383" cy="76" r="3.4"/>
      <circle cx="422" cy="91" r="3.4"/>
    </g>
    <g fill="#72efb5">
      <circle cx="150" cy="137" r="1.15"/>
      <circle cx="208" cy="111" r="1.15"/>
      <circle cx="247" cy="96" r="1.15"/>
      <circle cx="306" cy="84" r="1.15"/>
      <circle cx="344" cy="82" r="1.15"/>
      <circle cx="383" cy="76" r="1.15"/>
      <circle cx="422" cy="91" r="1.15"/>
    </g>
    <!-- signal-vias:end -->

    <!-- Output test pad. -->
    <!-- output-pad:start -->
    <circle cx="458" cy="91" r="7" fill="#173525" stroke="#487b5f" stroke-width="1"/>
    <circle cx="458" cy="91" r="4.2" fill="#d0a85b"/>
    <circle cx="458" cy="91" r="1.7" fill="#74551f"/>
    <!-- output-pad:end -->

    <rect x="0.75" y="0.75" width="493.5" height="178.5" rx="11.25" fill="none" stroke="#2e5f49" stroke-width="1.5"/>
  </g>
</svg>
